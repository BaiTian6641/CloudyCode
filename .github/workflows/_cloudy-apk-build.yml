name: Cloudy APK reusable build

# Reusable implementation shared by the Cloudy-X11 and Cloudy Code workflows.
# Callers own the PR/push/manual triggers, concurrency and app-specific secrets.
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_slug:
        required: true
        type: string
      project_dir:
        required: true
        type: string
      app_package:
        required: true
        type: string
      mode:
        required: true
        type: string
      native_engine:
        required: true
        type: boolean
      abi_label:
        required: true
        type: string
      expected_abis:
        required: false
        default: ''
        type: string
      required_native_lib:
        required: false
        default: ''
        type: string
      required_assets:
        required: false
        default: ''
        type: string
      implementation_stage:
        required: true
        type: string
      engine_lock_revision:
        required: false
        default: ''
        type: string
      cert_sha256:
        required: false
        default: ''
        type: string
      secret_prefix:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.app_name }} (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_SLUG: ${{ inputs.app_slug }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      APP_PACKAGE: ${{ inputs.app_package }}
      BUILD_MODE: ${{ inputs.mode }}
      NATIVE_ENGINE: ${{ inputs.native_engine }}
      ABI_LABEL: ${{ inputs.abi_label }}
      EXPECTED_ABIS: ${{ inputs.expected_abis }}
      REQUIRED_NATIVE_LIB: ${{ inputs.required_native_lib }}
      REQUIRED_ASSETS: ${{ inputs.required_assets }}
      IMPLEMENTATION_STAGE: ${{ inputs.implementation_stage }}
      ENGINE_LOCK_REVISION: ${{ inputs.engine_lock_revision }}
      CERT_SHA256: ${{ inputs.cert_sha256 }}
      SECRET_PREFIX: ${{ inputs.secret_prefix }}
      TRIGGER_REF: ${{ github.ref }}
      TRIGGER_EVENT: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare artifact identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          STAGE_DIR="$GITHUB_WORKSPACE/ci-dist/${APP_SLUG}"
          ARTIFACT_NAME="${APP_SLUG}-${BUILD_MODE}-${ABI_LABEL}-${SHORT_SHA}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          {
            echo "SHORT_SHA=$SHORT_SHA"
            echo "STAGE_DIR=$STAGE_DIR"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "APK_NAME=${ARTIFACT_NAME}.apk"
            echo "META_PATH=${STAGE_DIR}/build-metadata.json"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and native toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ${{ inputs.native_engine && 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.3.13750724 cmake;3.22.1' || 'platform-tools platforms;android-36 build-tools;36.0.0' }}

      - name: Set up Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Prepare toolchain environment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "BUILD_TOOLS_DIR=$SDK/build-tools/36.0.0" >> "$GITHUB_ENV"
          if [ "$NATIVE_ENGINE" = "true" ]; then
            echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"
            echo "ENGINE_CHECKOUT=$GITHUB_WORKSPACE/upstream/checkouts/magicdesk-x11" >> "$GITHUB_ENV"
            echo "ENGINE_BUILD=$GITHUB_WORKSPACE/upstream/checkouts/magicdesk-x11/build-ci" >> "$GITHUB_ENV"
            echo "$SDK/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate release request and signing inputs
        if: env.BUILD_MODE == 'release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Signed release builds are allowed only from refs/heads/main (requested ${GITHUB_REF})."
            exit 1
          fi
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("${SECRET_PREFIX}_${name}"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Signed release requested but required secrets are missing: ${missing[*]}."
            exit 1
          fi

      - name: Install native host dependencies
        if: inputs.native_engine
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build bison patch build-essential pkg-config

      - name: Fetch and build pinned magicdesk-x11
        if: inputs.native_engine
        shell: bash
        run: bash tools/ci/prepare-magicdesk-engine.sh

      - name: Run lint and unit tests
        shell: bash
        working-directory: ${{ inputs.project_dir }}
        run: |
          set -euo pipefail
          if [ "$NATIVE_ENGINE" = "true" ]; then
            ./gradlew --no-daemon --console=plain --stacktrace \
              :core:assembleDebug :core:lintDebug :app:lintDebug :app:testDebugUnitTest
          else
            ./gradlew --no-daemon --console=plain --stacktrace \
              :app:lintDebug :app:testDebugUnitTest
          fi

      - name: Assemble debug APK
        if: env.BUILD_MODE == 'debug'
        shell: bash
        working-directory: ${{ inputs.project_dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Assemble unsigned release APK
        if: env.BUILD_MODE == 'release'
        shell: bash
        working-directory: ${{ inputs.project_dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease

      - name: Stage debug APK
        if: env.BUILD_MODE == 'debug'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC" || { echo "::error::Debug APK not found at $SRC"; exit 1; }
          mkdir -p "$STAGE_DIR"
          cp "$SRC" "$STAGE_DIR/$APK_NAME"

      - name: Sign release APK and clean key material
        if: env.BUILD_MODE == 'release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/${APP_SLUG}-release-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"
          trap 'rm -rf "$SIGN_DIR"' EXIT
          KEYSTORE="$SIGN_DIR/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          UNSIGNED="$GITHUB_WORKSPACE/$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED" || { echo "::error::Unsigned release APK not found at $UNSIGNED"; exit 1; }
          mkdir -p "$STAGE_DIR"
          bash tools/ci/sign-release-apk.sh \
            "$UNSIGNED" "$STAGE_DIR/$APK_NAME" "$KEYSTORE" "$KEY_ALIAS" \
            KEYSTORE_PASSWORD KEY_PASSWORD "$BUILD_TOOLS_DIR"

      - name: Verify APK, native package, signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$STAGE_DIR/$APK_NAME"
          test -s "$APK" || { echo "::error::Final APK not found at $APK"; exit 1; }
          ARGS=(
            --apk "$APK"
            --package "$APP_PACKAGE"
            --app-name "$APP_NAME"
            --variant "$BUILD_MODE"
            --mode "$BUILD_MODE"
            --aapt2 "$BUILD_TOOLS_DIR/aapt2"
            --apksigner "$BUILD_TOOLS_DIR/apksigner"
            --metadata-out "$META_PATH"
          )
          if [ -n "$EXPECTED_ABIS" ]; then
            IFS=',' read -r -a ABIS <<< "$EXPECTED_ABIS"
            for abi in "${ABIS[@]}"; do ARGS+=(--expected-abi "$abi"); done
          fi
          if [ "$NATIVE_ENGINE" = "true" ]; then
            ARGS+=(--require-native-lib "$REQUIRED_NATIVE_LIB")
          fi
          if [ -n "$REQUIRED_ASSETS" ]; then
            IFS=',' read -r -a ASSETS <<< "$REQUIRED_ASSETS"
            for asset in "${ASSETS[@]}"; do ARGS+=(--require-asset "$asset"); done
          fi
          if [ "$BUILD_MODE" = "release" ] && [ -n "$CERT_SHA256" ]; then
            ARGS+=(--expected-cert-sha256 "$CERT_SHA256")
          fi
          CHECKS="lintDebug,testDebugUnitTest,assemble${BUILD_MODE},apk-inspection,apksigner,zipalign-16kb"
          if [ "$NATIVE_ENGINE" = "true" ]; then
            CHECKS="$CHECKS,native-engine-build,native-lib-packaged"
          fi
          if [ "$BUILD_MODE" = "release" ]; then CHECKS="$CHECKS,release-sign"; fi
          COMMIT="$(git rev-parse HEAD)"
          NATIVE_PACKAGED=false
          if [ "$NATIVE_ENGINE" = "true" ]; then NATIVE_PACKAGED=true; fi
          ARGS+=(
            --meta "commit=$COMMIT"
            --meta "trigger_ref=$TRIGGER_REF"
            --meta "trigger_event=$TRIGGER_EVENT"
            --meta "run_id=$GITHUB_RUN_ID"
            --meta "run_attempt=$GITHUB_RUN_ATTEMPT"
            --meta "pr_head_sha=$PR_HEAD_SHA"
            --meta "artifact_name=$ARTIFACT_NAME"
            --meta "implementation_stage=$IMPLEMENTATION_STAGE"
            --meta "native_engine_packaged=$NATIVE_PACKAGED"
            --meta "engine_lock_revision=$ENGINE_LOCK_REVISION"
            --meta "toolchain_jdk=21"
            --meta "toolchain_gradle=9.8.1"
            --meta "toolchain_agp=9.4.1"
            --meta "toolchain_compile_sdk=36"
            --meta "toolchain_build_tools=36.0.0"
            --meta "toolchain_ndk=$([ "$NATIVE_ENGINE" = "true" ] && echo 27.3.13750724 || true)"
            --meta "toolchain_cmake=$([ "$NATIVE_ENGINE" = "true" ] && echo 3.22.1 || true)"
            --meta "checks=$CHECKS"
          )
          python3 tools/ci/verify-apk.py "${ARGS[@]}"
          if [ "$NATIVE_ENGINE" = "true" ]; then
            SO="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libcloudy_x11_native.so"
            bash tools/device/verify-16kb.sh "$APK" "$SO"
          else
            "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          fi
          (cd "$STAGE_DIR" && sha256sum "$APK_NAME" build-metadata.json > SHA256SUMS)
          echo "Staged:"
          ls -l "$STAGE_DIR"

      - name: Upload APK, checksums and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ci-dist/${{ inputs.app_slug }}
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: success()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          meta = json.load(open(os.environ["META_PATH"], encoding="utf-8"))
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(f"## {meta['app_name']} {meta['mode']} APK")
          print("")
          print(f"- Artifact: `{meta['artifact_name']}`")
          print(f"- Run: {url}")
          print(f"- Commit: `{meta.get('commit', '')}`")
          print(f"- PR head: `{meta.get('pr_head_sha', '') or 'n/a'}`")
          print(f"- Package: `{meta['application_id']}`")
          print(f"- Version: `{meta['version_name']}` (`{meta['version_code']}`)")
          print(f"- SDK: min `{meta['min_sdk']}`, target `{meta['target_sdk']}`")
          print(f"- ABIs: `{', '.join(meta['abis']) or 'none'}`")
          print(f"- Stage: {meta.get('implementation_stage', '')}")
          print(f"- Native engine packaged: `{meta.get('native_engine_packaged')}`")
          print(f"- Signer SHA-256: `{meta['signing_certificate_sha256']}`")
          print(f"- APK SHA-256: `{meta['apk_sha256']}`")
          print(f"- Checks: `{meta.get('checks', '')}`")
          print("")
          print("Runtime X11 forwarding/freeform acceptance is separate from this build.")
          if meta["mode"] == "debug":
              print("Debug APKs use the runner-generated debug certificate; update continuity is not guaranteed.")
          PY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.app_slug }}-${{ inputs.mode }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.project_dir }}/app/build/reports
            ${{ inputs.project_dir }}/app/build/test-results
            ${{ inputs.project_dir }}/app/build/outputs/logs
            ${{ inputs.project_dir }}/core/build/reports
          if-no-files-found: ignore
          retention-days: 7
